name: deterministic-tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: System report
        run: python reviewer_validation/system_report.py

      - name: Compile source
        run: python -m compileall -q .

      - name: CLI help checks
        run: |
          python download_licsar_windows.py --help
          python multiframe_planner.py --help
          python verify_licsbas_structure.py --help

      - name: Deterministic unit tests
        run: python -m unittest discover -s tests -v

      - name: Reviewer zero-download regression check
        run: python reviewer_validation/reviewer_r1_mode_metrics.py --check --output-dir reviewer_outputs_ci
